<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Dark Tech Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0d1b2a"/>
      <stop offset="100%" stop-color="#1b263b"/>
    </linearGradient>

    <!-- Accent Neon Blue & Cyan Gradients -->
    <linearGradient id="cyanNeon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>

    <linearGradient id="emeraldNeon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00b09b"/>
      <stop offset="100%" stop-color="#96c93d"/>
    </linearGradient>

    <!-- Glow Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1"/>
    </pattern>
  </defs>

  <style>
    .title-text {
      font-family: 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;
      font-size: 52px;
      font-weight: 800;
      fill: #ffffff;
      letter-spacing: -1px;
    }

    .subtitle-text {
      font-family: 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;
      font-size: 22px;
      font-weight: 400;
      fill: #a0aec0;
      letter-spacing: 0.5px;
    }

    .badge-text {
      font-family: 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;
      font-size: 14px;
      font-weight: 700;
      fill: #00f2fe;
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }

    /* Dynamic CSS Animations */
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.4; transform: scale(1); }
      50% { opacity: 0.9; transform: scale(1.05); }
    }

    @keyframes pulseNode {
      0%, 100% { r: 6; fill-opacity: 0.8; }
      50% { r: 10; fill-opacity: 1; }
    }

    @keyframes dashLine {
      to { stroke-dashoffset: -40; }
    }

    .animated-bg-circle {
      animation: pulseGlow 6s ease-in-out infinite;
      transform-origin: center;
    }

    .node-pulse {
      animation: pulseNode 2.5s ease-in-out infinite;
    }

    .data-flow {
      stroke-dasharray: 8 6;
      animation: dashLine 3s linear infinite;
    }
  </style>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bgGrad)"/>
  <rect width="1200" height="400" fill="url(#grid)"/>

  <!-- Ambient Animated Glowing Orbs -->
  <circle class="animated-bg-circle" cx="950" cy="180" r="180" fill="#00f2fe" opacity="0.15" filter="url(#glow)"/>
  <circle class="animated-bg-circle" cx="1050" cy="250" r="120" fill="#00b09b" opacity="0.12" filter="url(#glow)"/>

  <!-- Smart Building Schematic / IoT Network Graphic -->
  <g transform="translate(720, 60)">
    <!-- Building Silhouette -->
    <path d="M 120 280 L 120 90 L 220 40 L 320 90 L 320 280 Z" fill="none" stroke="rgba(255, 255, 255, 0.15)" stroke-width="2"/>
    <path d="M 170 280 L 170 120 L 270 120 L 270 280 Z" fill="none" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1.5"/>

    <!-- Floors &amp; Windows Grid -->
    <line x1="120" y1="140" x2="320" y2="140" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <line x1="120" y1="190" x2="320" y2="190" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <line x1="120" y1="240" x2="320" y2="240" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

    <!-- Connected IoT Nodes and Energy Flow Lines -->
    <path class="data-flow" d="M 60 220 L 140 160 L 220 70 L 300 160 L 380 220" fill="none" stroke="url(#cyanNeon)" stroke-width="2.5" filter="url(#glow)"/>
    <path class="data-flow" d="M 100 260 L 220 180 L 340 260" fill="none" stroke="url(#emeraldNeon)" stroke-width="2" filter="url(#glow)"/>

    <!-- Interactive Glowing Sensor Nodes -->
    <circle class="node-pulse" cx="220" cy="70" r="7" fill="#00f2fe" filter="url(#glow)"/>
    <circle class="node-pulse" cx="140" cy="160" r="7" fill="#00f2fe" filter="url(#glow)" style="animation-delay: 0.5s;"/>
    <circle class="node-pulse" cx="300" cy="160" r="7" fill="#00f2fe" filter="url(#glow)" style="animation-delay: 1s;"/>
    <circle class="node-pulse" cx="220" cy="180" r="8" fill="#96c93d" filter="url(#glow)" style="animation-delay: 0.8s;"/>
    <circle class="node-pulse" cx="60" cy="220" r="6" fill="#00f2fe" filter="url(#glow)" style="animation-delay: 1.2s;"/>
    <circle class="node-pulse" cx="380" cy="220" r="6" fill="#00f2fe" filter="url(#glow)" style="animation-delay: 1.5s;"/>
  </g>

  <!-- Left Content Area -->
  <g transform="translate(80, 0)">
    <!-- Category Badge -->
    <rect x="0" y="85" width="280" height="34" rx="17" fill="rgba(0, 242, 254, 0.1)" stroke="rgba(0, 242, 254, 0.3)" stroke-width="1"/>
    <text x="20" y="107" class="badge-text">⚡ SMART BUILDING ECOSYSTEM</text>

    <!-- Main Heading -->
    <text x="0" y="180" class="title-text">Awesome Smart Building</text>
    <text x="0" y="235" class="title-text" fill="url(#cyanNeon)">Platform</text>

    <!-- Subtitle -->
    <text x="0" y="285" class="subtitle-text">Curated SaaS Platforms, BMS Automation &amp; Open-Source IoT</text>

    <!-- Stat Pills -->
    <g transform="translate(0, 315)">
      <rect x="0" y="0" width="160" height="32" rx="8" fill="rgba(255, 255, 255, 0.06)"/>
      <text x="14" y="21" font-family="Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">🏢 Enterprise BMS</text>

      <rect x="175" y="0" width="160" height="32" rx="8" fill="rgba(255, 255, 255, 0.06)"/>
      <text x="189" y="21" font-family="Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">🌱 Energy Optimization</text>

      <rect x="350" y="0" width="150" height="32" rx="8" fill="rgba(255, 255, 255, 0.06)"/>
      <text x="364" y="21" font-family="Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">💻 Open Source</text>
    </g>
  </g>
</svg>
