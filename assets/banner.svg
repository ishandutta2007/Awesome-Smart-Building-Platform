<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 400"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0a0f1d"/><stop offset="50%" stop-color="#0d1b2a"/><stop offset="100%" stop-color="#1b263b"/></linearGradient><linearGradient id="cyanNeon" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#00f2fe"/><stop offset="100%" stop-color="#4facfe"/></linearGradient><linearGradient id="emeraldNeon" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#00b09b"/><stop offset="100%" stop-color="#96c93d"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="6"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1" d="M 40 0 L 0 0 0 40"/></pattern></defs><style>@keyframes pulseGlow{0%{opacity:.4;transform:scale(1)}50%{opacity:.9;transform:scale(1.05)}}@keyframes pulseNode{0%{r:6;fill-opacity:.8}50%{r:10;fill-opacity:1}}.badge-text,.subtitle-text,.title-text{font-family:&apos;Segoe UI&apos;,system-ui,-apple-system,Roboto,sans-serif}.title-text{font-size:52px;font-weight:800;fill:#fff;letter-spacing:-1px}.subtitle-text{font-size:22px;font-weight:400;fill:#a0aec0;letter-spacing:.5px}.badge-text{font-size:14px;font-weight:700;fill:#00f2fe;text-transform:uppercase;letter-spacing:1.5px}.animated-bg-circle{animation:pulseGlow 6s ease-in-out infinite;transform-origin:center}.node-pulse{animation:pulseNode 2.5s ease-in-out infinite}.data-flow{stroke-dasharray:8 6;animation:dashLine 3s linear infinite}</style><rect width="1200" height="400" fill="url(#bgGrad)"/><rect width="1200" height="400" fill="url(#grid)"/><circle cx="950" cy="180" r="180" fill="#00f2fe" class="animated-bg-circle" filter="url(#glow)" opacity=".15"/><circle cx="1050" cy="250" r="120" fill="#00b09b" class="animated-bg-circle" filter="url(#glow)" opacity=".12"/><g transform="translate(720, 60)"><path fill="none" stroke="rgba(255, 255, 255, 0.15)" stroke-width="2" d="M 120 280 L 120 90 L 220 40 L 320 90 L 320 280 Z"/><path fill="none" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1.5" d="M 170 280 L 170 120 L 270 120 L 270 280 Z"/><line x1="120" x2="320" y1="140" y2="140" stroke="rgba(255,255,255,0.08)" stroke-width="1"/><line x1="120" x2="320" y1="190" y2="190" stroke="rgba(255,255,255,0.08)" stroke-width="1"/><line x1="120" x2="320" y1="240" y2="240" stroke="rgba(255,255,255,0.08)" stroke-width="1"/><path fill="none" stroke="url(#cyanNeon)" stroke-width="2.5" d="M 60 220 L 140 160 L 220 70 L 300 160 L 380 220" class="data-flow" filter="url(#glow)"/><path fill="none" stroke="url(#emeraldNeon)" stroke-width="2" d="M 100 260 L 220 180 L 340 260" class="data-flow" filter="url(#glow)"/><circle cx="220" cy="70" r="7" fill="#00f2fe" class="node-pulse" filter="url(#glow)"/><circle cx="140" cy="160" r="7" fill="#00f2fe" class="node-pulse" filter="url(#glow)" style="animation-delay:.5s"/><circle cx="300" cy="160" r="7" fill="#00f2fe" class="node-pulse" filter="url(#glow)" style="animation-delay:1s"/><circle cx="220" cy="180" r="8" fill="#96c93d" class="node-pulse" filter="url(#glow)" style="animation-delay:.8s"/><circle cx="60" cy="220" r="6" fill="#00f2fe" class="node-pulse" filter="url(#glow)" style="animation-delay:1.2s"/><circle cx="380" cy="220" r="6" fill="#00f2fe" class="node-pulse" filter="url(#glow)" style="animation-delay:1.5s"/></g><g transform="translate(80, 0)"><rect width="280" height="34" x="0" y="85" fill="rgba(0, 242, 254, 0.1)" stroke="rgba(0, 242, 254, 0.3)" stroke-width="1" rx="17"/><text x="20" y="107" class="badge-text">⚡ SMART BUILDING ECOSYSTEM</text><text x="0" y="180" class="title-text">Awesome Smart Building</text><text x="0" y="235" fill="url(#cyanNeon)" class="title-text">Platform</text><text x="0" y="285" class="subtitle-text">Curated SaaS Platforms, BMS Automation &amp; Open-Source IoT</text><g transform="translate(0, 315)"><rect width="160" height="32" x="0" y="0" fill="rgba(255, 255, 255, 0.06)" rx="8"/><text x="14" y="21" fill="#e2e8f0" font-family="Segoe UI, sans-serif" font-size="13" font-weight="600">🏢 Enterprise BMS</text><rect width="160" height="32" x="175" y="0" fill="rgba(255, 255, 255, 0.06)" rx="8"/><text x="189" y="21" fill="#e2e8f0" font-family="Segoe UI, sans-serif" font-size="13" font-weight="600">🌱 Energy Optimization</text><rect width="150" height="32" x="350" y="0" fill="rgba(255, 255, 255, 0.06)" rx="8"/><text x="364" y="21" fill="#e2e8f0" font-family="Segoe UI, sans-serif" font-size="13" font-weight="600">💻 Open Source</text></g></g></svg>